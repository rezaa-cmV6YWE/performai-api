openapi: 3.1.0
info:
  title: performai API
  version: 1.0.0
  description: |
    Performai API is a high-performance, stateless rhythm game API for arcade rhythm games like maimai DX.
    It provides authentication, player profile scraping, and rating / Best 50 calculation.

servers:
  - url: http://localhost:8787
    description: Local development server

tags:
  - name: system
    description: System health and status endpoints
  - name: maimai
    description: maimai DX player profile, authentication, and rating endpoints

paths:
  /ok:
    get:
      tags:
        - system
      summary: Health check
      description: Returns the health status of the API server.
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/{server}/maimai/login:
    post:
      tags:
        - maimai
      summary: Maimai login
      description: Authenticates with SEGA ID and maimai NET to obtain a session cookie.
      parameters:
        - name: server
          in: path
          required: true
          description: Target maimai server region (only 'intl' is currently supported).
          schema:
            type: string
            enum:
              - intl
              - jp
              - cn
            example: intl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaimaiLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaimaiLoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failure or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Server region not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: External gateway error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/{server}/maimai/profile:
    get:
      tags:
        - maimai
      summary: Get maimai profile
      description: Fetches user profile details including player name, rating, stars, title, trophy tier, play counts, icon, and active cosmetics (nameplate, frame).
      parameters:
        - name: server
          in: path
          required: true
          description: Target maimai server region (only 'intl' is currently supported).
          schema:
            type: string
            enum:
              - intl
              - jp
              - cn
            example: intl
        - name: x-maimai-cookie
          in: header
          required: true
          description: Full maimai session cookie string obtained from the login endpoint.
          schema:
            type: string
            example: '_t=a1b2c3d4e5...; userId=1234567890'
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaimaiProfileResponse'
        '400':
          description: Validation error or missing header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Maimai session expired or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Server region not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: External service error or HTML parse failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/{server}/maimai/rating:
    get:
      tags:
        - maimai
      summary: Get maimai rating and Best 50
      description: Scrapes user scores across all difficulty tiers, calculates song ratings using OtogeDB chart constants, and returns the Best 50 (15 new songs + 35 old songs) breakdown and overall DX rating.
      parameters:
        - name: server
          in: path
          required: true
          description: Target maimai server region (only 'intl' is currently supported).
          schema:
            type: string
            enum:
              - intl
              - jp
              - cn
            example: intl
        - name: x-maimai-cookie
          in: header
          required: true
          description: Full maimai session cookie string obtained from the login endpoint.
          schema:
            type: string
            example: '_t=a1b2c3d4e5...; userId=1234567890'
      responses:
        '200':
          description: Rating and Best 50 computed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaimaiRatingResponse'
        '400':
          description: Validation error or missing header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Maimai session expired or unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Server region not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: External service error or score scraping failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable error message
              example: Invalid request input

    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - ok
          properties:
            ok:
              type: boolean
              description: Whether the API server is healthy
              example: true

    MaimaiLoginRequest:
      type: object
      required:
        - segaId
        - password
      properties:
        segaId:
          type: string
          minLength: 1
          description: SEGA ID or registered email address for maimai NET login
          example: player@example.com
        password:
          type: string
          minLength: 1
          description: Password associated with the SEGA ID account
          example: P@ssw0rd123

    MaimaiLoginResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - cookie
          properties:
            cookie:
              type: string
              description: Authenticated maimai session cookie string to pass in x-maimai-cookie header
              example: '_t=a1b2c3d4e5...; userId=1234567890'

    MaimaiProfile:
      type: object
      required:
        - rating
        - title
        - playCount
      properties:
        name:
          type: string
          nullable: true
          description: In-game player name
          example: ＰＥＲＦＯＲＭＡＩ
        rating:
          type: object
          required:
            - value
          properties:
            value:
              type: integer
              minimum: 0
              description: Overall player DX rating value
              example: 15420
            color:
              type: string
              format: uri
              nullable: true
              description: URL of the rating plate badge image
              example: https://maimaidx-eng.com/maimai-mobile/img/rating_rainbow.png
        icon:
          type: string
          format: uri
          nullable: true
          description: URL of the active user icon image
          example: https://maimaidx-eng.com/maimai-mobile/img/Icon/123456.png
        title:
          type: object
          properties:
            value:
              type: string
              nullable: true
              description: In-game title / trophy text
              example: 真・皆伝
            typeUrl:
              type: string
              format: uri
              nullable: true
              description: URL to the title plate background graphic
            type:
              type: string
              enum:
                - rainbow
                - gold
                - silver
                - bronze
                - normal
              nullable: true
              description: Trophy rarity tier
              example: rainbow
        stars:
          type: integer
          minimum: 0
          nullable: true
          description: DX Star count (でらっくすスター)
          example: 42
        playCount:
          type: object
          properties:
            versionPlayCount:
              type: integer
              minimum: 0
              nullable: true
              description: Play count in the current maimai version
              example: 150
            totalPlayCount:
              type: integer
              minimum: 0
              nullable: true
              description: Total play count across all versions
              example: 1200
        courseRank:
          type: string
          format: uri
          nullable: true
          description: URL to the course rank (段位認定) badge image
        classRank:
          type: string
          format: uri
          nullable: true
          description: URL to the matching class rank (オトモダチ対戦クラス) badge image

    MaimaiProfileExtended:
      allOf:
        - $ref: '#/components/schemas/MaimaiProfile'
        - type: object
          properties:
            nameplate:
              type: string
              format: uri
              nullable: true
              description: URL of the currently equipped nameplate cosmetic
            frame:
              type: string
              format: uri
              nullable: true
              description: URL of the currently equipped frame cosmetic

    MaimaiProfileResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MaimaiProfileExtended'

    MaimaiRatingSong:
      type: object
      required:
        - name
        - type
        - difficulty
        - level
        - internalLevel
        - achievement
        - dxScore
        - rating
        - jacket
        - combo
        - sync
      properties:
        name:
          type: string
          description: Song title
          example: Garakuta Doll Play
        type:
          type: string
          enum:
            - std
            - dx
          description: Chart type (Standard or Deluxe)
          example: dx
        difficulty:
          type: string
          enum:
            - basic
            - advanced
            - expert
            - master
            - remaster
          description: Difficulty tier
          example: master
        level:
          type: string
          description: Displayed difficulty level
          example: 14+
        internalLevel:
          type: number
          description: Internal chart constant from OtogeDB
          example: 14.7
        achievement:
          type: number
          description: Achievement rate multiplied by 10000 (e.g. 1005000 = 100.5000%)
          example: 1005000
        dxScore:
          type: number
          description: Achieved DX score
          example: 2150
        rating:
          type: integer
          description: Calculated individual song rating value
          example: 329
        jacket:
          type: string
          format: uri
          nullable: true
          description: Full URL to the song jacket image
          example: https://maimaidx-eng.com/maimai-mobile/img/Music/garakuta.png
        combo:
          type: object
          required:
            - type
            - image
          properties:
            type:
              type: string
              nullable: true
              description: Full Combo status (fc, fc+, ap, ap+, or null)
              example: ap+
            image:
              type: string
              format: uri
              nullable: true
              description: URL to the FC icon badge image
        sync:
          type: object
          required:
            - type
            - image
          properties:
            type:
              type: string
              nullable: true
              description: Full Sync status (sync, fs, fs+, fdx, fdx+, or null)
              example: fdx+
            image:
              type: string
              format: uri
              nullable: true
              description: URL to the FS icon badge image

    MaimaiRating:
      type: object
      required:
        - rating
        - ratingImage
        - newRatingSongs
        - oldRatingSongs
      properties:
        rating:
          type: integer
          description: Sum of top 15 new songs rating + top 35 old songs rating
          example: 15420
        ratingImage:
          type: string
          format: uri
          nullable: true
          description: URL to the rating tier badge image
          example: https://maimaidx-eng.com/maimai-mobile/img/rating_rainbow.png
        newRatingSongs:
          type: array
          items:
            $ref: '#/components/schemas/MaimaiRatingSong'
          description: Top 15 highest-rated songs from the current version window
        oldRatingSongs:
          type: array
          items:
            $ref: '#/components/schemas/MaimaiRatingSong'
          description: Top 35 highest-rated songs from past versions

    MaimaiRatingResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MaimaiRating'
